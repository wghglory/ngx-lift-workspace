<form clrForm [formGroup]="form">
  <p class="clr-required-mark">{{ 'timelineWizard.requiredInfo' | translate }}</p>
  <clr-input-container>
    <label class="clr-required-mark" for="service-cpu">{{ 'timelineWizard.cpu' | translate }}</label>
    <input type="text" id="service-cpu" clrInput [formControl]="form.controls.cpu" [size]="30" />
    <clr-control-error>{{ 'common.required' | translate }}</clr-control-error>
  </clr-input-container>
  <clr-input-container>
    <label class="clr-required-mark" for="service-replicas">{{ 'timelineWizard.replicas' | translate }}</label>
    <input type="text" id="service-replicas" clrInput [formControl]="form.controls.replicas" [size]="30" />
    <clr-control-error>{{ 'common.required' | translate }}</clr-control-error>
  </clr-input-container>
  <clr-input-container>
    <label class="clr-required-mark" for="service-url">{{ 'timelineWizard.url' | translate }}</label>
    <input type="text" id="service-url" clrInput [formControl]="form.controls.url" [size]="30" />
    <clr-control-error>{{ 'common.required' | translate }}</clr-control-error>
  </clr-input-container>
</form>
