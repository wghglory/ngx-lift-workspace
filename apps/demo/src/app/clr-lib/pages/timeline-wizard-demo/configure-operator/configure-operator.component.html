<form clrForm [formGroup]="form">
  <p class="clr-required-mark">{{ 'timelineWizard.requiredInfo' | translate }}</p>
  <clr-input-container>
    <label class="clr-required-mark" for="operator-name">{{ 'timelineWizard.name' | translate }}</label>
    <input type="text" id="operator-name" clrInput [formControl]="form.controls.operator.controls.name" />
    <clr-control-error>{{ 'common.required' | translate }}</clr-control-error>
  </clr-input-container>
  <clr-input-container>
    <label class="clr-required-mark" for="operator-namespace">{{ 'timelineWizard.namespace' | translate }}</label>
    <input type="text" id="operator-namespace" clrInput [formControl]="form.controls.operator.controls.namespace" />
    <clr-control-error>{{ 'common.required' | translate }}</clr-control-error>
  </clr-input-container>
</form>
