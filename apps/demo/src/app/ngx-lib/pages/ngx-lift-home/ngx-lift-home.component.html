<div cds-layout="vertical gap:xl p:lg">
  <section class="clr-row clr-align-items-center">
    <div class="clr-col-12 clr-col-xl-6" cds-layout="vertical gap:md">
      <h1 cds-text="display">{{ 'home.ngxLift.title' | translate }}</h1>
      <p cds-text="title" cds-layout="m-t:sm" [innerHTML]="'home.ngxLift.subtitle' | translate"></p>
      <app-code-block [code]="'npm install ngx-lift'" lang="shell" />

      <div cds-layout="vertical gap:xs">
        <p cds-text="section font:semibold">{{ 'home.ngxLift.supportMatrix' | translate }}</p>
        <table class="table table-compact">
          <thead>
            <tr>
              <th>{{ 'home.ngxLift.thVersion' | translate }}</th>
              <th>{{ 'home.ngxLift.thNgVersion' | translate }}</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>v1.x</td>
              <td>Angular 17+</td>
            </tr>
            <tr>
              <td>v19.x</td>
              <td>Angular 19, 20</td>
            </tr>
            <tr>
              <td>v21.x</td>
              <td>Angular 21</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="clr-col-12 clr-col-xl-6">
      <img class="hero-image" cds-layout="p:sm" src="./assets/ngx-lift-dark.svg" alt="ngx-lift" />
    </div>
  </section>

  <section class="clr-row">
    <div class="clr-col-12 clr-col-lg-4">
      <app-tile-with-icon
        icon="⚒️"
        [title]="'home.ngxLift.utilityTitle' | translate"
        [description]="'home.ngxLift.utilityDesc' | translate"
      />
    </div>
    <div class="clr-col-12 clr-col-lg-4">
      <app-tile-with-icon
        icon="📦"
        [title]="'home.ngxLift.rxjsTitle' | translate"
        [description]="'home.ngxLift.rxjsDesc' | translate"
      />
    </div>
    <div class="clr-col-12 clr-col-lg-4">
      <app-tile-with-icon
        icon="🚨"
        [title]="'home.ngxLift.signalTitle' | translate"
        [description]="'home.ngxLift.signalDesc' | translate"
      />
    </div>
  </section>
</div>
