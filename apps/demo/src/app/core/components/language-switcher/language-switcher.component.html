<clr-dropdown [clrCloseMenuOnItemClick]="true">
  <button
    type="button"
    class="nav-link btn btn-link language-trigger"
    clrDropdownTrigger
    [attr.aria-label]="'header.selectLanguage' | translate"
  >
    <clr-icon shape="world" />
    <span class="lang-text">{{ currentLabel() }}</span>
    <clr-icon shape="angle" dir="down" class="dropdown-caret" size="12" />
  </button>
  <clr-dropdown-menu clrPosition="bottom-right" *clrIfOpen>
    <span class="dropdown-header">{{ 'header.selectLanguage' | translate }}</span>
    @for (lang of languages; track lang.code) {
      <button
        type="button"
        clrDropdownItem
        [class.active]="activeLanguageCode() === lang.code"
        [attr.aria-current]="activeLanguageCode() === lang.code ? 'true' : null"
        (click)="selectLanguage(lang.code)"
      >
        <span class="dropdown-item-label">{{ lang.label }}</span>
        @if (activeLanguageCode() === lang.code) {
          <clr-icon shape="check" class="is-success active-check" />
        }
      </button>
    }
  </clr-dropdown-menu>
</clr-dropdown>
