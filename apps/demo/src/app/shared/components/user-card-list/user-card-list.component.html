@if (usersState$ | async; as usersState) {
  <div>
    <button
      class="btn btn-primary"
      (click)="loadExample()"
      [clrLoading]="usersState.isLoading"
      [attr.aria-label]="'common.seeUiBehavior' | translate"
    >
      {{ 'common.seeUiBehavior' | translate }}
    </button>
  </div>

  <div class="min-h-[286px]" cds-layout="m-t:lg">
    @if (usersState.isLoading) {
      <cll-spinner />
    }

    @if (usersState.error; as error) {
      <cll-alert [error]="error" />
    }

    @if (usersState.data?.results; as users) {
      <div class="card-grid">
        @for (user of users; track user.id.value) {
          <app-user-card [user]="user" />
        }
      </div>
    }
  </div>
}
