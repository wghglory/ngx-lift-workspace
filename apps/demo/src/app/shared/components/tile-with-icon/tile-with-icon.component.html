<app-tile>
  <div cds-layout="horizontal gap:md align:top">
    <div cds-text="display" cds-layout="m:none">{{ icon() }}</div>
    <div cds-layout="vertical gap:xs">
      <h2 cds-text="title" cds-layout="m-t:none">{{ title() }}</h2>
      <p [innerHTML]="description()"></p>
      <ng-content />
    </div>
  </div>
</app-tile>
