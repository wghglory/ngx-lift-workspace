<clr-radio-container clrInline>
  <label for="filter-gender">{{ 'filterUsers.selectGender' | translate }}</label>
  <clr-radio-wrapper>
    <input type="radio" id="filter-gender-male" clrRadio name="gender" value="male" [formControl]="genderControl" />
    <label for="filter-gender-male">{{ 'common.male' | translate }}</label>
  </clr-radio-wrapper>
  <clr-radio-wrapper>
    <input type="radio" id="filter-gender-female" clrRadio name="gender" value="female" [formControl]="genderControl" />
    <label for="filter-gender-female">{{ 'common.female' | translate }}</label>
  </clr-radio-wrapper>
</clr-radio-container>

@if (searchState$ | async; as vm) {
  <div class="min-h-[286px]" cds-layout="m-t:lg">
    @if (vm.isLoading) {
      <cll-spinner />
    }
    @if (vm.error; as error) {
      <cll-alert [error]="error" />
    }
    @if (vm.data; as users) {
      <div class="card-grid">
        @for (user of users.results; track user.email) {
          <app-user-card [user]="user" />
        }
      </div>
    }
  </div>
}
