@if (vm$ | async; as vm) {
  <p>
    {{ 'rockStar.todayIs' | translate }} <time> {{ formatDate(vm.today) }} </time>.
    {{ 'rockStar.whoIsStar' | translate }}
    <button (click)="showRockStar()" class="btn btn-outline">{{ 'rockStar.unveil' | translate }}</button>
  </p>

  @if (vm.rockStarState?.error; as error) {
    <cll-alert [error]="error" />
  }
  @if (vm.rockStarState?.isLoading) {
    <cll-spinner />
  }
  @if (vm.rockStarState?.data; as rockStar) {
    <p class="rock-star-name">{{ rockStar.name }}</p>
  }
}
