@if (user()) {
  <div class="card h-full" style="margin-top: 0">
    <div class="card-block" style="display: flex; gap: 2.25rem">
      <img [src]="user().picture.thumbnail" alt="thumbnail" style="width: 3rem; height: 3rem; flex-shrink: 0" />
      <dl
        style="
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          flex: 1 1 0%;
          column-gap: 1rem;
          row-gap: 0.5rem;
        "
      >
        <dt style="font-weight: 500">{{ 'common.name' | translate }}</dt>
        <dd>{{ user().name.first }} {{ user().name.last }}</dd>
        <dt style="font-weight: 500">{{ 'common.gender' | translate }}</dt>
        <dd>{{ user().gender }}</dd>
      </dl>
    </div>
  </div>
}
