@for (kvControl of formArray().controls; track kvControl; let i = $index) {
  <div class="inputs-container" [attr.data-key-value-row]="i">
    <cll-key-value-field
      data-key-field
      [control]="kvControl.controls.key"
      [config]="resolveKeyConfig(kvControl)"
      [controlId]="controlIdPrefix + '-key-' + i"
      [label]="'key-value.key' | translate"
      [helper]="keyHelper()"
      [inputSize]="inputSize()"
      [patternMessage]="keyPattern()?.message || ''"
    />
    <cll-key-value-field
      [control]="kvControl.controls.value"
      [config]="resolveValueConfig(kvControl.controls.key.value)"
      [controlId]="controlIdPrefix + '-value-' + i"
      [label]="'key-value.value' | translate"
      [helper]="valueHelper()"
      [inputSize]="inputSize()"
      [patternMessage]="valuePattern()?.message || ''"
    />
    <button
      type="button"
      class="btn btn-sm btn-link btn-icon"
      [attr.aria-label]="('key-value.delete' | translate) + ' ' + (i + 1)"
      [disabled]="formArray().disabled || kvControl.disabled"
      (click)="removeKeyValuePair(i)"
    >
      <clr-icon shape="times" aria-hidden="true" />
    </button>
  </div>
}

<div class="button-container">
  <button
    type="button"
    data-add-key-value
    [class]="'btn ' + buttonClass()"
    (click)="addKeyValuePair()"
    [disabled]="!canAdd()"
  >
    {{ computedAddText() }}
  </button>
</div>
