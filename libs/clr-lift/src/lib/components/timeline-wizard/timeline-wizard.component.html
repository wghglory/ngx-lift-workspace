<clr-timeline class="timeline-container">
  @for (step of timelineWizardService.steps; track step.title) {
    <clr-timeline-step [clrState]="step.state">
      <clr-timeline-step-header>{{ step.header }}</clr-timeline-step-header>
      <clr-timeline-step-title>{{ step.title }}</clr-timeline-step-title>
      <clr-timeline-step-description [class.error-text]="step.state === 'error'">
        {{ step.description }}
      </clr-timeline-step-description>
    </clr-timeline-step>
  }
</clr-timeline>

<!-- dynamic component container -->
<div class="content">
  <ng-template #container />
</div>

@if (timelineWizardService.currentStepIndex !== -1) {
  <div class="button-container">
    <button type="button" class="btn btn-link" (click)="cancel()">
      {{ 'timeline-wizard.cancel' | translate }}
    </button>
    @if (!timelineWizardService.isFirstStep) {
      <button
        type="button"
        class="btn btn-outline"
        [disabled]="timelineWizardService.currentStep.state === 'processing'"
        (click)="previousStep()"
      >
        {{ 'timeline-wizard.previous' | translate }}
      </button>
    }
    <button
      type="button"
      class="btn"
      [class]="timelineWizardService.isLastStep ? 'btn-success' : 'btn-primary'"
      [clrLoading]="(next$ | async)?.isLoading === true"
      [attr.aria-label]="(timelineWizardService.isLastStep ? confirmButtonText() : 'timeline-wizard.next') | translate"
      (click)="nextStep()"
    >
      {{ (timelineWizardService.isLastStep ? confirmButtonText() : 'timeline-wizard.next') | translate }}
    </button>
  </div>
}
