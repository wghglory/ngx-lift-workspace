name: Publish Libraries

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify publication without publishing packages or modifying Git'
        required: true
        default: true
        type: boolean
      version:
        description: 'Dry-run version preview; real publication requires skip and a merged version PR'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - skip
      project:
        description: 'Project to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ngx-lift
          - clr-lift
  push:
    tags:
      - 'v*'
      - 'ngx-lift@*'
      - 'clr-lift@*'

# Serialize publications for a tag; never cancel one already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_VERSION: ${{ inputs.version || 'skip' }}
  RELEASE_PROJECT: ${{ inputs.project || 'all' }}

jobs:
  release-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Require reviewed versions for real publication
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ] && [ "$RELEASE_DRY_RUN" != "true" ] && [ "$RELEASE_VERSION" != "skip" ]; then
            echo "::error::Merge a version/changelog PR first, then publish with version=skip or push its reviewed release tags. Other version choices are dry-run previews only."
            exit 1
          fi
  quality:
    needs: release-inputs
    uses: ./.github/workflows/quality.yml
    secrets: inherit
  publish:
    needs: quality
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure npm registry
        run: |
          sed -i 's|registry=.*|registry=https://registry.npmjs.org/|' .npmrc

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Configure npm authentication
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured or empty!"
            exit 1
          fi

      - name: Verify npm credentials
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Testing npm credentials against official registry..."
          npm whoami --registry=https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine projects
        id: projects
        run: |
          case "$RELEASE_VERSION" in
            major|minor|patch|skip) ;;
            *) echo "::error::Unsupported release version"; exit 1 ;;
          esac
          case "$RELEASE_PROJECT" in
            all|ngx-lift|clr-lift) ;;
            *) echo "::error::Unsupported release project"; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" == "push" ]; then
            REF="$GITHUB_REF"
            if [[ "$REF" == refs/tags/ngx-lift@* ]]; then
              echo "PROJECTS=ngx-lift" >> $GITHUB_ENV
              echo "PROJECT_FLAG=--projects=ngx-lift" >> $GITHUB_ENV
            elif [[ "$REF" == refs/tags/clr-lift@* ]]; then
              echo "PROJECTS=clr-lift" >> $GITHUB_ENV
              echo "PROJECT_FLAG=--projects=clr-lift" >> $GITHUB_ENV
            else
              echo "PROJECTS=ngx-lift,clr-lift" >> $GITHUB_ENV
              echo "PROJECT_FLAG=" >> $GITHUB_ENV
            fi
          elif [ "$RELEASE_PROJECT" == "all" ]; then
            echo "PROJECTS=ngx-lift,clr-lift" >> $GITHUB_ENV
            echo "PROJECT_FLAG=" >> $GITHUB_ENV
          else
            echo "PROJECTS=$RELEASE_PROJECT" >> $GITHUB_ENV
            echo "PROJECT_FLAG=--projects=$RELEASE_PROJECT" >> $GITHUB_ENV
          fi

      - name: Build libraries
        id: build-libs
        run: pnpm nx run-many -t build --projects=${{ env.PROJECTS }} --parallel=2

      - name: Run unit tests
        id: run-unit-tests
        run: pnpm nx run-many -t test --projects=${{ env.PROJECTS }} --parallel=2

      - name: Verify publication without side effects
        id: publish-dry-run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          # Consumer verification packs both libraries, including their dependency relationship.
          pnpm nx run-many -t build --projects=ngx-lift,clr-lift --parallel=2
          pnpm run verify:packages
          if [ "$RELEASE_VERSION" != "skip" ]; then
            pnpm nx release version "$RELEASE_VERSION" $PROJECT_FLAG --dry-run --git-commit=false --git-tag=false
          fi
          pnpm nx release publish ${{ env.PROJECT_FLAG }} --dry-run --registry=https://registry.npmjs.org/

      - name: Upload verified packages
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-release-packages
          path: dist/libs/
          if-no-files-found: error

      - name: Publish reviewed versions (manual trigger)
        id: publish-manual
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # clr-lift peers on ngx-lift, so publish the core package first when both are selected.
          if [ -z "$PROJECT_FLAG" ]; then
            pnpm nx release publish --projects=ngx-lift --registry=https://registry.npmjs.org/
            pnpm nx release publish --projects=clr-lift --registry=https://registry.npmjs.org/
          else
            pnpm nx release publish ${{ env.PROJECT_FLAG }} --registry=https://registry.npmjs.org/
          fi

      - name: Publish from tag
        id: publish-tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # clr-lift peers on ngx-lift, so publish the core package first when both are selected.
          if [ -z "$PROJECT_FLAG" ]; then
            pnpm nx release publish --projects=ngx-lift --registry=https://registry.npmjs.org/
            pnpm nx release publish --projects=clr-lift --registry=https://registry.npmjs.org/
          else
            pnpm nx release publish ${{ env.PROJECT_FLAG }} --registry=https://registry.npmjs.org/
          fi

      - name: Create GitHub Release
        id: github-release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          generateReleaseNotes: true
          makeLatest: true
          allowUpdates: true

      - name: Generate Publish Summary
        if: always()
        run: |
          BUILD_STATUS="${{ steps.build-libs.outcome }}"
          TEST_STATUS="${{ steps.run-unit-tests.outcome }}"
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              PUBLISH_STATUS="${{ steps.publish-dry-run.outcome }}"
            else
              PUBLISH_STATUS="${{ steps.publish-manual.outcome }}"
            fi
            VERSION_TYPE="$RELEASE_VERSION"
            PROJECT="$RELEASE_PROJECT"
            TRIGGER_INFO="**Dry run**: ${{ inputs.dry_run }}<br>**Version Type**: \`$VERSION_TYPE\`<br>**Project**: \`$PROJECT\`"
          else
            PUBLISH_STATUS="${{ steps.publish-tag.outcome }}"
            TAG="${{ github.ref }}"
            TRIGGER_INFO="**Tag**: \`$TAG\`"
          fi

          RELEASE_STATUS="${{ steps.github-release.outcome }}"

          get_status_icon() {
            case "$1" in
              "success") echo "✅" ;;
              "failure") echo "❌" ;;
              "cancelled") echo "🚫" ;;
              "skipped") echo "⏭️" ;;
              *) echo "⏳" ;;
            esac
          }

          get_status_badge() {
            case "$1" in
              "success") echo "![Success](https://img.shields.io/badge/status-success-brightgreen)" ;;
              "failure") echo "![Failure](https://img.shields.io/badge/status-failure-red)" ;;
              "cancelled") echo "![Cancelled](https://img.shields.io/badge/status-cancelled-yellow)" ;;
              "skipped") echo "![Skipped](https://img.shields.io/badge/status-skipped-lightgrey)" ;;
              *) echo "![Pending](https://img.shields.io/badge/status-pending-orange)" ;;
            esac
          }

          BUILD_ICON=$(get_status_icon "$BUILD_STATUS")
          TEST_ICON=$(get_status_icon "$TEST_STATUS")
          PUBLISH_ICON=$(get_status_icon "$PUBLISH_STATUS")
          RELEASE_ICON=$(get_status_icon "$RELEASE_STATUS")

          BUILD_BADGE=$(get_status_badge "$BUILD_STATUS")
          TEST_BADGE=$(get_status_badge "$TEST_STATUS")
          PUBLISH_BADGE=$(get_status_badge "$PUBLISH_STATUS")
          RELEASE_BADGE=$(get_status_badge "$RELEASE_STATUS")

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 📦 Library Publishing Summary

          ## 📋 Publish Information

          | Property | Value |
          |----------|-------|
          | **Event** | \`$EVENT\` |
          | $TRIGGER_INFO |
          | **Node.js** | \`24.x\` |

          ---

          ## 🔨 Build & Test Steps

          | Step | Status | Description |
          |------|--------|-------------|
          | 🏗️ **Build Libraries** | $BUILD_ICON $BUILD_BADGE | Build selected libraries |
          | 🧪 **Run Unit Tests** | $TEST_ICON $TEST_BADGE | Run unit tests for selected libraries |

          ---

          ## 📤 Publish Steps

          | Step | Status | Description |
          |------|--------|-------------|
          | 📦 **Publish to NPM** | $PUBLISH_ICON $PUBLISH_BADGE | Publish libraries to npm registry |
          $([ "$EVENT" = "push" ] && echo "| 🏷️ **GitHub Release** | $RELEASE_ICON $RELEASE_BADGE | Create GitHub release from tag |" || echo "")

          ---

          ## 📈 Overall Status

          $([ "$BUILD_STATUS" = "success" ] && [ "$TEST_STATUS" = "success" ] && [ "$PUBLISH_STATUS" = "success" ] && echo "### ✅ Release workflow completed successfully (dry run: ${{ inputs.dry_run }})" || echo "### ⚠️ Publishing did not complete successfully. Check logs for details.")

          EOF
