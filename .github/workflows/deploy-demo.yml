name: Deploy Demo App

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize deployments for a ref; never cancel one already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets: inherit
  deploy:
    needs: quality
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        id: build-libs
        run: pnpm nx run-many -t build --projects=ngx-lift,clr-lift --parallel=2

      - name: Build demo app
        id: build-demo
        run: pnpm nx build demo --configuration=production

      # Both production targets are required on main; keep Vercel independent of a Netlify failure.
      - name: Deploy to Netlify
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        id: netlify
        continue-on-error: true
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4
        with:
          publish-dir: './dist/apps/demo/browser'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Deploy to Vercel (production, main only)
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        id: vercel
        continue-on-error: true
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./dist/apps/demo/browser
          target: production
        timeout-minutes: 5

      - name: Generate Deployment Summary
        if: always()
        run: |
          BUILD_LIBS_STATUS="${{ steps.build-libs.outcome }}"
          BUILD_DEMO_STATUS="${{ steps.build-demo.outcome }}"
          NETLIFY_STATUS="${{ steps.netlify.outcome }}"
          VERCEL_STATUS="${{ steps.vercel.outcome }}"
          BRANCH="${{ github.ref }}"
          EVENT="${{ github.event_name }}"

          get_status_icon() {
            case "$1" in
              "success") echo "✅" ;;
              "failure") echo "❌" ;;
              "cancelled") echo "🚫" ;;
              "skipped") echo "⏭️" ;;
              *) echo "⏳" ;;
            esac
          }

          get_status_badge() {
            case "$1" in
              "success") echo "![Success](https://img.shields.io/badge/status-success-brightgreen)" ;;
              "failure") echo "![Failure](https://img.shields.io/badge/status-failure-red)" ;;
              "cancelled") echo "![Cancelled](https://img.shields.io/badge/status-cancelled-yellow)" ;;
              "skipped") echo "![Skipped](https://img.shields.io/badge/status-skipped-lightgrey)" ;;
              *) echo "![Pending](https://img.shields.io/badge/status-pending-orange)" ;;
            esac
          }

          BUILD_LIBS_ICON=$(get_status_icon "$BUILD_LIBS_STATUS")
          BUILD_DEMO_ICON=$(get_status_icon "$BUILD_DEMO_STATUS")
          NETLIFY_ICON=$(get_status_icon "$NETLIFY_STATUS")
          VERCEL_ICON=$(get_status_icon "$VERCEL_STATUS")

          BUILD_LIBS_BADGE=$(get_status_badge "$BUILD_LIBS_STATUS")
          BUILD_DEMO_BADGE=$(get_status_badge "$BUILD_DEMO_STATUS")
          NETLIFY_BADGE=$(get_status_badge "$NETLIFY_STATUS")
          VERCEL_BADGE=$(get_status_badge "$VERCEL_STATUS")

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 Demo App Deployment Summary

          ## 📋 Deployment Information

          | Property | Value |
          |----------|-------|
          | **Event** | \`$EVENT\` |
          | **Branch** | \`$BRANCH\` |
          | **Node.js** | \`24.x\` |

          ---

          ## 🏗️ Build Steps

          | Step | Status | Description |
          |------|--------|-------------|
          | 📦 **Build Libraries** | $BUILD_LIBS_ICON $BUILD_LIBS_BADGE | Build ngx-lift and clr-lift |
          | 🎨 **Build Demo App** | $BUILD_DEMO_ICON $BUILD_DEMO_BADGE | Build demo app for production |

          ---

          ## 🌐 Deployment Targets

          | Platform | Status | Description |
          |----------|--------|-------------|
          | 🟢 **Netlify** | $NETLIFY_ICON $NETLIFY_BADGE | Production deployment |
          | ⚫ **Vercel** | $VERCEL_ICON $VERCEL_BADGE | Production deployment |

          ---

          ## 📈 Overall Status

          Both production targets are required on main. A single failed target fails the job gate without skipping the other target.

          $([ "$BUILD_LIBS_STATUS" = "success" ] && [ "$BUILD_DEMO_STATUS" = "success" ] && [ "$NETLIFY_STATUS" = "success" ] && [ "$VERCEL_STATUS" = "success" ] && echo "### ✅ Deployment completed successfully!" || echo "### ⚠️ Deployment did not complete successfully. Check logs for details.")

          EOF

      - name: Enforce deployment gate
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          BUILD_LIBS_STATUS: ${{ steps.build-libs.outcome }}
          BUILD_DEMO_STATUS: ${{ steps.build-demo.outcome }}
          NETLIFY_STATUS: ${{ steps.netlify.outcome }}
          VERCEL_STATUS: ${{ steps.vercel.outcome }}
        run: |
          if [ "$BUILD_LIBS_STATUS" != "success" ] || [ "$BUILD_DEMO_STATUS" != "success" ]; then
            echo "::error::Build steps failed; production deployment was not attempted."
            exit 1
          fi
          if [ "$NETLIFY_STATUS" != "success" ] || [ "$VERCEL_STATUS" != "success" ]; then
            echo "::error::At least one required production deployment failed."
            exit 1
          fi
          echo "Both Netlify and Vercel production deployments succeeded."
