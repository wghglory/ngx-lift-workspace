name: Quality gates
on:
  workflow_call:
permissions:
  contents: read

# Nx Cloud remote cache. Sourced from the NX_CLOUD_ACCESS_TOKEN repo secret.
# Callers that pass the secret (e.g. `secrets: inherit`) get the remote cache.
# When the free-account credits are exhausted, the token is absent, or Nx Cloud
# is unreachable, Nx logs a warning and runs tasks locally — the workflow still
# passes. Together with the parallel + `nx affected` jobs below, typical PRs stay
# fast even without a remote cache hit.
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  BASE_URL: http://127.0.0.1:4307
  PLAYWRIGHT_BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium,firefox,webkit' }}

jobs:
  # Whole-repo, dependency-free checks. Always runs fully.
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run i18n:check
      - run: pnpm run test:tools

  # Lint + typecheck. `nx affected` on PRs, full `run-many` on push.
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Fetch base branch for affected
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.base_ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute nx command
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "cmd=affected --base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=run-many" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm exec nx ${{ steps.scope.outputs.cmd }} -t lint typecheck --parallel=3

  # Unit tests (no coverage in the PR gate). `nx affected` on PRs, full on push.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Fetch base branch for affected
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.base_ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute nx command
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "cmd=affected --base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=run-many" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm exec nx ${{ steps.scope.outputs.cmd }} -t test --parallel=3

  # Builds. Package/bundle verification runs only on the full (push) path.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Fetch base branch for affected
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.base_ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute nx command
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "cmd=affected --base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=run-many" >> "$GITHUB_OUTPUT"
          fi
      # Best-effort local cache fallback for months when Nx Cloud credits run out.
      - name: Restore local Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nx-${{ runner.os }}-
      - run: pnpm exec nx ${{ steps.scope.outputs.cmd }} -t build --parallel=2
      - name: Package & bundle verification
        if: github.event_name != 'pull_request'
        run: pnpm run bundle:check && pnpm run verify:packages

  # E2E only for affected projects on PRs; full on push.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Fetch base branch for affected
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.base_ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install --with-deps
          fi
      - name: Compute nx command
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "cmd=affected --base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
            echo "target=e2e-ci" >> "$GITHUB_OUTPUT"
            echo "parallel=3" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=run-many" >> "$GITHUB_OUTPUT"
            echo "target=e2e" >> "$GITHUB_OUTPUT"
            echo "parallel=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build demo for e2e
        if: github.event_name == 'pull_request'
        run: pnpm exec nx build demo
      - name: Build demo for e2e (push)
        if: github.event_name != 'pull_request'
        run: pnpm exec nx build demo
      - name: Start demo static server
        run: |
          if [ ! -f dist/apps/demo/browser/index.html ]; then
            echo 'dist/apps/demo/browser/index.html not found after build'
            find dist -maxdepth 4 -name index.html || true
            exit 1
          fi
          pnpm dlx serve@14.2.4 dist/apps/demo/browser --single --listen tcp://127.0.0.1:4307 --no-port-switching --no-request-logging > /tmp/demo-e2e-server.log 2>&1 &
          echo $! > /tmp/demo-e2e-server.pid
          npx --yes wait-on@8.0.3 tcp:127.0.0.1:4307 --timeout 180000 || {
            echo '--- demo static server log ---'
            tail -200 /tmp/demo-e2e-server.log || true
            exit 1
          }
      - run: pnpm exec nx ${{ steps.scope.outputs.cmd }} -t ${{ steps.scope.outputs.target }} --parallel=${{ steps.scope.outputs.parallel }}
      - name: Merge atomized Playwright reports
        if: always() && github.event_name == 'pull_request' && steps.scope.outputs.target == 'e2e-ci'
        run: |
          affected=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --withTarget e2e-ci --json)
          if echo "$affected" | grep -q 'demo-e2e'; then
            pnpm exec nx run demo-e2e:e2e-ci--merge-reports --skip-nx-cache || true
          fi
      - name: Stop demo static server
        if: always()
        run: |
          if [ -f /tmp/demo-e2e-server.pid ]; then
            kill "$(cat /tmp/demo-e2e-server.pid)" 2>/dev/null || true
          fi
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: dist/.playwright/apps/demo-e2e/playwright-report/
          if-no-files-found: ignore

  # Full coverage report — detached from the PR gate; runs on push/main + schedule.
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/
          # Do not mask an earlier failure (e.g. format:check) with an unrelated
          # artifact error when test:coverage never produced the directory.
          if-no-files-found: warn